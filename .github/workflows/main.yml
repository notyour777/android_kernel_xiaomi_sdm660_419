name: CI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/user-why-red/android_kernel_xiaomi_sdm660_44
          kernel-branch: ksu-patches
          config: cas_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 13
          aosp-clang-version: r383902
          ksu: true
          ksu-lkm: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
